name: Build native packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve application version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "1.0.0"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Install WiX Toolset 3
        shell: pwsh
        run: choco install wixtoolset --version 3.14.1.20250415 --yes --no-progress

      - name: Add WiX tools to PATH
        shell: pwsh
        run: |
          $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" |
            Select-Object -First 1
          if ($null -eq $candle) {
            throw "WiX candle.exe was not found after installation"
          }
          $candle.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Create Windows EXE installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\package-input, dist\windows | Out-Null
          Copy-Item target\java-snake.jar build\package-input\java-snake.jar
          jpackage `
            --type exe `
            --name "Java Snake" `
            --input build\package-input `
            --main-jar java-snake.jar `
            --main-class uz.mirmaxsudov.Main `
            --app-version $env:APP_VERSION `
            --vendor "Abdurahmon" `
            --description "A modern Snake game for the terminal" `
            --dest dist\windows `
            --win-console `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: java-snake-windows-x64
          path: dist/windows/*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Create terminal-friendly macOS DMG
        shell: bash
        run: |
          mkdir -p build/package-input build/macos-app build/macos-dmg dist/macos
          cp target/java-snake.jar build/package-input/java-snake.jar
          jpackage \
            --type app-image \
            --name "Java Snake" \
            --input build/package-input \
            --main-jar java-snake.jar \
            --main-class uz.mirmaxsudov.Main \
            --app-version "$APP_VERSION" \
            --vendor "Abdurahmon" \
            --description "A modern Snake game for the terminal" \
            --dest build/macos-app
          cp -R "build/macos-app/Java Snake.app" build/macos-dmg/
          cp "packaging/macos/Play Java Snake.command" build/macos-dmg/
          chmod +x "build/macos-dmg/Play Java Snake.command"
          ln -s /Applications build/macos-dmg/Applications
          codesign --force --deep --sign - "build/macos-dmg/Java Snake.app"
          hdiutil create \
            -volname "Java Snake" \
            -srcfolder build/macos-dmg \
            -ov \
            -format UDZO \
            "dist/macos/Java-Snake-macos-${{ matrix.arch }}-${APP_VERSION}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: java-snake-macos-${{ matrix.arch }}
          path: dist/macos/*.dmg
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve application version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=1.0.0" >> "$GITHUB_ENV"
          fi

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot rpm

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Create DEB and RPM packages
        shell: bash
        run: |
          mkdir -p build/package-input dist/linux
          cp target/java-snake.jar build/package-input/java-snake.jar
          for package_type in deb rpm; do
            jpackage \
              --type "$package_type" \
              --name java-snake \
              --input build/package-input \
              --main-jar java-snake.jar \
              --main-class uz.mirmaxsudov.Main \
              --app-version "$APP_VERSION" \
              --vendor "Abdurahmon" \
              --description "A modern Snake game for the terminal" \
              --dest dist/linux \
              --resource-dir packaging/linux \
              --install-dir /opt/java-snake \
              --linux-shortcut \
              --linux-menu-group Games \
              --linux-app-category Game
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: java-snake-linux-x64
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all native packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --generate-notes \
              --title "Java Snake $GITHUB_REF_NAME"
          fi
